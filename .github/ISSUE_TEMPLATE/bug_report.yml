name: Bug report
description: Report a defect in walletkit
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For **security vulnerabilities**, do not use this form —
        see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or steps. Include the chain / network if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: walletkit version / commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Rust version (`rustc -V`), OS, and any relevant feature flags.
    validations:
      required: false
