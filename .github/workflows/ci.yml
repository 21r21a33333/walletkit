name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # The trait + InMemoryStateStore must still compile with every backend/tracing
      # feature stripped (the embedded-nothing path a minimal dependent builds).
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      # localnet integration tests skip cleanly when anvil/Foundry is absent, so the
      # full suite runs here without a node.
      - name: Test
        run: cargo test --all-targets --locked
      # Docs must build clean with every feature on (matching docs.rs). Broken/private
      # intra-doc links are denied in the crate root; `-D warnings` catches the rest.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  msrv:
    name: msrv (1.94.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the declared floor (Cargo.toml `rust-version`, inherited from alloy). If a
      # dependency bump raises the real minimum, this job fails and prompts an honest
      # `rust-version` update rather than letting the manifest drift out of truth.
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Check (all features, locked)
        run: cargo check --all-features --locked

  feature-matrix:
    name: feature matrix (cargo-hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Features are purely additive: each must compile alone, with none, and with all.
      - name: Check each feature
        run: cargo hack check --each-feature --locked

  # Keep the changelog honest: any change under src/ must record a user-facing entry.
  # Apply the `skip-changelog` label for pure refactors/CI-only PRs.
  changelog:
    name: changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry for code changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::src/ changed but CHANGELOG.md was not updated. Add an entry under [Unreleased], or apply the 'skip-changelog' label."
            exit 1
          fi

  postgres:
    name: postgres backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: walletkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # The `postgres` conformance test connects here; absent this, it skips.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/walletkit
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (postgres)
        run: cargo clippy --all-targets --features postgres --locked -- -D warnings
      - name: Test (postgres)
        run: cargo test --all-targets --features postgres --locked
