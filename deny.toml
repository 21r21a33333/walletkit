# cargo-deny configuration. Run report-only in CI (see .github/workflows/supply-chain.yml):
# it surfaces findings without blocking merges. This file stays honest regardless —
# nothing is silenced without a tracked reason.

# Scan the full dependency set, including optional features (postgres, policy-moonpay,
# pricing), so advisories and licenses in gated deps are not missed.
[graph]
all-features = true

[advisories]
# RustSec advisory database. Security *vulnerabilities* always fire. "Unmaintained"
# notices are scoped to our direct deps — we can't act on a transitive crate alloy or
# wasmtime chose (e.g. fxhash, paste), and a permanently-red check trains reviewers to
# ignore it, burying a real vuln when one lands. Keeps the signal actionable.
unmaintained = "workspace"
# Each ignore needs a reason and, ideally, an expiry so exceptions cannot rot silently.
ignore = []

[licenses]
# Permissive-only allow-list, derived from the actual dependency tree. Copyleft crates
# present in the graph (ittapi: GPL-2.0-only OR BSD-3-Clause; r-efi: … OR LGPL-2.1-or-later)
# are dual-licensed with a permissive arm that cargo-deny selects, so they need no entry.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate version trees are effectively unavoidable in an alloy/wasmtime graph — warn,
# don't block. Wildcard (`*`) version requirements in our own manifest are a real smell.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and explicitly-listed git sources; anything else is suspicious.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
