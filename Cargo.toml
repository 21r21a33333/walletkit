[package]
name = "walletkit"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Client-side ergonomic facade over alloy for wallet infrastructure and transaction execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/21r21a33333/walletkit"
readme = "README.md"
keywords = ["ethereum", "evm", "wallet", "alloy", "transaction"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[dependencies]
alloy-consensus = "2.4.1"
# Typed contract instances (`#[sol(rpc)]` + `.call()`) for the read client's ERC-20/721/1155
# and Multicall3 reads.
alloy-contract = "2.4.1"
# EIP-712 `TypedData`/`Eip712Domain` for the signing surface; reuse alloy's encoder.
alloy-dyn-abi = { version = "1", features = ["eip712"] }
alloy-eips = "2.4.1"
# ENS resolution (namehash + registry/resolver reads) behind the `EnsResolver` port.
# `provider` pulls in the `ProviderEnsExt` methods (+ `contract`, `EnsError`).
alloy-ens = { version = "2.4.1", features = ["provider"] }
# Deps are added per-consumer (see docs/plans): thiserror/tokio/async-trait/tracing
# arrive with the ports and adapters that first use them, not up front.
alloy-primitives = { version = "1", features = ["serde"] }
alloy-provider = "2.4.1"
alloy-rpc-client = "2.4.1"
alloy-rpc-types-eth = "2.4.1"
alloy-signer = "2.4.1"
alloy-signer-local = { version = "2.4.1", features = ["keystore", "mnemonic"] }
# `sol!` typed ABI + `Revert`/`Panic` revert decoding, used directly by the read/preview adapters.
alloy-sol-types = "1"
alloy-transport = { version = "2.4.1", features = ["throttle"] }
alloy-transport-http = { version = "2.4.1", features = ["reqwest"] }
async-trait = "0.1.92"
# HD derivation for AccountManager: BIP-32 extended keys (`XPriv`/`XPub`) and BIP-39
# mnemonics. Pinned to the versions alloy-signer-local uses to avoid duplicate trees;
# English-only wordlist keeps the embedded word data small.
coins-bip32 = "0.12"
coins-bip39 = { version = "0.12", default-features = false, features = ["english"] }
# poison-free locks — no `.lock().unwrap()` in production code.
parking_lot = "0.12"
# OS CSPRNG for fail-closed mnemonic entropy (matches coins-bip39's rand major).
rand = "0.8"
# Durable embedded StateStore backend (pure-Rust ACID KV); opt-in via the `redb` feature.
redb = { version = "4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Networked/shared StateStore backend (pure-Rust Postgres driver); opt-in via `postgres`.
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "json",
] }
thiserror = "2.0.20"
# policy-moonpay (opt-in): the OWS executable runs as a wasip1 plugin; wasmtime is
# heavy (cranelift), so it's gated. time parses OWS `expires_at` timestamps.
time = { version = "0.3", features = ["parsing"], optional = true }
# runtime for the facade's opt-in `run(interval)` background tick loop.
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
tower = "0.5.3"
# Observability: emit-only (the host installs the subscriber/exporter). Optional but on by
# default; a `default-features = false` build strips it to no-ops via src/obs.rs.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std", "attributes", "log"] }
url = { version = "2.5.8", features = ["serde"] }
wasmtime = { version = "36", optional = true }
wasmtime-wasi = { version = "36", optional = true }
zeroize = "1.9.0"

[features]
default = ["tracing", "redb"]
tracing = ["dep:tracing"]
redb = ["dep:redb"]
postgres = ["dep:sqlx"]
policy-moonpay = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:time"]
# Opt-in token-metadata + price seam (token-list + Chainlink). Reuses deps already
# present (serde/serde_json/alloy-contract); no new crates.
pricing = []

[dev-dependencies]
alloy-node-bindings = "2.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
tempfile = "3"
